name: Bug report
description: Something isn't working as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problem?** Please use [private reporting](https://github.com/omsingh02/leery/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a room…
        2. Add a bot…
        3. …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where were you playing?
      options: [Phone browser, Desktop browser, Installed to home screen]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: Safari on iOS 19, Chrome 140 on Windows 11…
  - type: input
    id: room
    attributes:
      label: Room code (optional)
      description: Helps to find it in the logs. Never paste tokens or keys.
